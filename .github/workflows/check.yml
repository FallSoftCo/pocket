name: Check
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Post-merge {0}', inputs.commit) || github.event.head_commit.message || github.event.pull_request.title || 'Check' }}
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Immutable merged commit to verify
        required: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        id: dependencies
        shell: bash
        run: |
          mkdir -p dist/ci
          npm ci 2>&1 | tee dist/ci/dependency-install.log
      - name: Resolve required DOM dependency
        shell: bash
        run: |
          node --input-type=module <<'NODE' 2>&1 | tee dist/ci/dom-dependency.log
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          assert.equal(require('jsdom/package.json').version,'26.1.0');
          const modulePath=require.resolve('jsdom');
          appendFileSync(process.env.GITHUB_ENV,`NEXTCOMP_JSDOM_MODULE=${modulePath}\nJSDOM_MODULE=${modulePath}\n`);
          console.log('Required DOM module:',modulePath);
          NODE
      - name: Backend tests including conversation DOM
        shell: bash
        run: npm test 2>&1 | tee dist/ci/backend-tests.log
      - name: Required DOM and production integration qualification
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:dom -- dist/ci/dom
      - name: Preserve test and qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dom-qualification
          path: dist/ci/
          if-no-files-found: warn
          retention-days: 7
      - run: npm audit --omit=dev
      - run: node scripts/check-public-source.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || '' }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease lintRelease
        working-directory: android
